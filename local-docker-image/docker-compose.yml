name: sonar-local

services:
  sonar-local:
    # Same tested image as repo-root Dockerfile ARG SONARQUBE_IMAGE_TAG / pom sonar.tested.docker.image.tag.
    image: sonarqube:26.3.0.120487-community
    build:
      context: .
    ports:
      - "9000:9000"
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./extensions/plugins:/opt/sonarqube/extensions/plugins:ro
      - ./conf:/opt/sonarqube/conf:ro
